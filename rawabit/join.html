<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انضمّ إلى مجموعتي — روابط الكلمات</title>
<meta name="description" content="دعوة إلى مجموعة في روابط الكلمات: لغز يومي، نقارن نتائجنا كل يوم.">
<meta property="og:title" content="انضمّ إلى مجموعتي في روابط الكلمات">
<meta property="og:description" content="شبكة واحدة كل يوم، 16 كلمة و4 روابط خفيّة. لنقارن نتائجنا!">
<style>
  :root { --violet:#7048E8; --violet-lip:#5233B8; --ground:#FFF6E6; --ink:#1E1B2E; --soft:#5B5670; --teal:#0E8A7E; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; line-height:1.7; }
  main { max-width:460px; margin:0 auto; padding:2.2rem 1.2rem 3rem; text-align:center; }
  .tiles { display:grid; grid-template-columns:repeat(2, 46px); gap:8px; justify-content:center; margin:0 auto 1.2rem; transform:rotate(45deg); width:100px; height:100px; align-content:center; }
  .tiles span { width:46px; height:46px; border-radius:10px; box-shadow:0 4px 0 rgba(0,0,0,.18); }
  h1 { font-size:1.6rem; margin:.4rem 0 .2rem; }
  p { color:var(--soft); margin:.3rem 0; }
  .code { direction:ltr; font-size:2.4rem; font-weight:800; letter-spacing:.35em; color:#fff; background:var(--teal); border-radius:20px; padding:.6rem 0 .6rem .35em; margin:1.4rem 0 .4rem; box-shadow:0 5px 0 #0A6A61; }
  .btn { display:block; text-decoration:none; font-weight:800; font-size:1.15rem; border-radius:20px; padding:1rem; margin:1rem 0 0; }
  .primary { background:var(--violet); color:#fff; box-shadow:0 5px 0 var(--violet-lip); }
  .secondary { background:#fff; color:var(--ink); box-shadow:0 4px 0 #E6DCCB; }
  ol { text-align:right; color:var(--soft); padding-inline-start:1.2rem; margin:1.6rem 0 0; }
  .muted { font-size:.9rem; }
</style>
</head>
<body>
<main>
  <div class="tiles" aria-hidden="true">
    <span style="background:#F7C948"></span><span style="background:#40C057"></span>
    <span style="background:#E64980"></span><span style="background:#339AF0"></span>
  </div>
  <h1>دعوة إلى مجموعة</h1>
  <p>في <b>روابط الكلمات</b>: شبكة واحدة كل يوم، 16 كلمة و4 روابط خفيّة. نحلّها كل يوم ونقارن نتائجنا.</p>
  <div class="code" id="code">······</div>
  <p class="muted">رمز المجموعة</p>
  <a class="btn primary" id="open" href="#">افتح في اللعبة</a>
  <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.inktalelearning.rawabit">حمّل اللعبة من Google Play</a>
  <ol>
    <li>حمّل اللعبة وافتحها.</li>
    <li>من تبويب «الترتيب» › «مجموعاتي» › «انضم برمز».</li>
    <li>اكتب الرمز أعلاه.</li>
  </ol>
</main>
<script>
  // The code from ?c=, kept to the game's alphabet; the button opens the app on it, or the store.
  var raw = (new URLSearchParams(location.search).get('c') || '').toUpperCase();
  var code = /^[A-HJ-NP-Z2-9]{6}$/.test(raw) ? raw : '';
  var store = 'https://play.google.com/store/apps/details?id=com.inktalelearning.rawabit';
  if (code) {
    document.getElementById('code').textContent = code;
    document.getElementById('open').href = 'intent://join/' + code +
      '#Intent;scheme=rawabit;package=com.inktalelearning.rawabit;S.browser_fallback_url=' + encodeURIComponent(store) + ';end';
  } else {
    document.getElementById('code').textContent = '—';
    document.getElementById('open').href = store;
  }
</script>
</body>
</html>
