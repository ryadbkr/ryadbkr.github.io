name: fetch-assets
on:
  push:
    branches: [fetch-assets]
    paths: [ads/fetch.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ads/fetched
          while read -r name url; do [ -n "$name" ] && curl -sSfL -o "ads/fetched/$name" "$url"; done < ads/fetch.txt
          git config user.name "fetch-bot"; git config user.email "noreply@github.com"
          git add ads/fetched && git commit -m "fetched assets" && git push
