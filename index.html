<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink Learning Studios</title>
<meta name="description" content="Small, hand-made games for Android by Ink Learning Studios: Flags Ink and Zipstache.">
<style>
  :root { --paper:#FAF9F5; --ink:#24222B; --soft:#6A6774; --line:#E6E3DA; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.6; }
  main { max-width: 720px; margin: 0 auto; padding: 56px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--soft); margin: 0 0 40px; }
  .app { display:flex; gap:18px; align-items:flex-start; padding: 22px 0; border-top: 1px solid var(--line); }
  .app:last-of-type { border-bottom: 1px solid var(--line); }
  .dot { flex: none; width: 44px; height: 44px; border-radius: 14px; }
  .app h2 { margin: 0 0 4px; font-size: 1.25rem; }
  .app h2 a { color: var(--ink); text-decoration: none; }
  .app h2 a:hover, .app h2 a:focus-visible { text-decoration: underline; }
  .app p { margin: 0 0 8px; color: var(--soft); }
  .links a { color: var(--ink); margin-right: 16px; font-size: .95rem; }
  a:focus-visible { outline: 3px solid #8CC26A; outline-offset: 2px; }
  footer { margin-top: 40px; color: var(--soft); font-size: .9rem; }
  footer a { color: var(--soft); }
</style>
</head>
<body>
<main>
  <h1>Ink Learning Studios</h1>
  <p class="sub">Small, hand-made games for Android.</p>

  <section class="app">
    <span class="dot" style="background:#8CC26A" aria-hidden="true"></span>
    <div>
      <h2><a href="Zipstache/">Zipstache</a></h2>
      <p>A cozy path puzzle with Pistache the kitten. Draw his walk across every tile.</p>
      <p class="links"><a href="Zipstache/privacy.html">Privacy</a></p>
    </div>
  </section>

  <section class="app">
    <span class="dot" style="background:#6366F1" aria-hidden="true"></span>
    <div>
      <h2><a href="flags-ink/">Flags Ink</a></h2>
      <p>Colour, discover and master the flags of the world.</p>
      <p class="links"><a href="https://play.google.com/store/apps/details?id=com.inktalelearning.flagsink">Google Play</a><a href="privacy.html">Privacy</a></p>
    </div>
  </section>

  <footer>Contact: <a href="mailto:ryad.iv@gmail.com">ryad.iv@gmail.com</a> · © 2026 Ink Learning Studios</footer>
</main>
</body>
</html>
